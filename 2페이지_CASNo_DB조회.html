<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAS No. DB 조회</title>
<link rel="stylesheet" href="common.css?v=20260918b">
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="header-left">
        <div class="logo-wrap">
          <img id="logo-img" src="logo.png" alt="SP SAMHWA"
               onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
          <div class="logo-fallback" id="logo-fallback">SP SAMHWA</div>
        </div>
        <div class="page-title">화학물질 변경이력 조회</div>
      </div>
      <div class="header-right">
        <div class="user-badge" id="header-user">
          <div class="user-avatar">
            <img src="user-photo.png" alt="홍길동"
                 onerror="this.replaceWith(document.createTextNode('홍'));">
          </div>
          <div class="user-text">
            <div class="user-team">품질경영팀</div>
            <div class="user-name">홍길동 프로</div>
          </div>
        </div>
        <div class="header-clock" id="header-clock"></div>
      </div>
    </header>

    <div class="app-body">
      <nav class="sidebar">
        <div class="sidebar-label">MENU</div>
        <a href="1페이지_메인대시보드.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg></span>변경이력 조회
        </a>
        <a href="2페이지_CASNo_DB조회.html" class="active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/></svg></span>CAS No. DB 조회
        </a>
        <a href="3페이지_재료_DB조회.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>재료 DB 조회
        </a>
        <a href="4페이지_제품_DB조회.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10 12.5 2.5 3 3l.5 9.5L11 20a2 2 0 0 0 2.8 0L20 13.8a2 2 0 0 0 0-2.8Z"/><circle cx="8.5" cy="7.5" r="1.5"/></svg></span>제품 DB 조회
        </a>
      </nav>

      <main>
        <div class="search-card">
          <div class="search-grid">
            <div class="search-field">
              <label for="f-casno">CAS NO.</label>
              <input type="text" id="f-casno" placeholder="예: 64-17-5">
            </div>
            <div class="search-field search-field-range">
              <label>등록일자</label>
              <div class="range-inputs">
                <input type="date" id="f-reg-from">
                <span class="range-sep">~</span>
                <input type="date" id="f-reg-to">
              </div>
            </div>
            <div class="search-field search-field-range">
              <label>변경일자</label>
              <div class="range-inputs">
                <input type="date" id="f-chg-from">
                <span class="range-sep">~</span>
                <input type="date" id="f-chg-to">
              </div>
            </div>
            <div class="search-field">
              <label for="f-mode">조회 구분</label>
              <select id="f-mode">
                <option value="all">전체</option>
                <option value="same">동일</option>
                <option value="changed">변경</option>
              </select>
            </div>
            <button class="search-btn" id="btn-search">조회</button>
          </div>
        </div>

        <div class="card result-card">
          <div class="result-inner">
            <div class="card-header">
              <h3>CAS No. DB 조회 결과</h3>
              <div class="result-stats" id="result-count"></div>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>CAS NO.</th><th>기존</th><th>등록일자</th><th>변경</th><th>변경일자</th><th>상세조회</th></tr>
                </thead>
                <tbody id="result-body"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="common.js?v=20260918b"></script>
  <script>
    // ---------- Mock 데이터: cas / name / registered(등록일자) / changed(변경일자, 없으면 '') ----------
    const CAS_DATA = [
      { cas: '64-17-5', name: '에탄올', registered: '2019-05-10', changed: '2026-09-10' },
      { cas: '67-56-1', name: '메탄올', registered: '2018-03-22', changed: '2026-09-05' },
      { cas: '7732-18-5', name: '정제수', registered: '2017-01-15', changed: '' },
      { cas: '7647-14-5', name: '염화나트륨', registered: '2020-06-01', changed: '2026-08-20' },
      { cas: '9004-32-4', name: '카르복시메틸셀룰로오스', registered: '2021-02-14', changed: '' },
      { cas: '57-55-6', name: '프로필렌글리콜', registered: '2019-11-03', changed: '2026-07-15' },
      { cas: '9005-64-5', name: '폴리소르베이트 80', registered: '2020-09-09', changed: '' },
      { cas: '112-34-5', name: '디에틸렌글리콜모노부틸에테르', registered: '2018-12-25', changed: '2026-06-02' },
      { cas: '77-92-9', name: '시트르산', registered: '2016-04-18', changed: '' },
      { cas: '56-81-5', name: '글리세린', registered: '2015-07-07', changed: '2026-05-11' },
      { cas: '108-95-2', name: '페놀', registered: '2022-01-01', changed: '' },
      { cas: '50-70-4', name: '소르비톨', registered: '2017-08-19', changed: '2026-04-03' },
      { cas: '9002-84-0', name: '폴리에틸렌', registered: '2019-10-10', changed: '' },
      { cas: '79-14-1', name: '글리콜산', registered: '2021-05-05', changed: '2026-03-22' },
      { cas: '111-30-8', name: '글루타르알데히드', registered: '2016-09-30', changed: '' },
      { cas: '149-57-5', name: '2-에틸헥산산', registered: '2020-02-17', changed: '2026-02-09' },
      { cas: '25322-68-3', name: 'PEG-400', registered: '2018-06-06', changed: '' },
      { cas: '61789-40-0', name: '코카미도프로필베타인', registered: '2022-03-29', changed: '2026-01-14' },
      { cas: '7727-37-9', name: '질소', registered: '2015-01-01', changed: '' },
      { cas: '9003-11-6', name: '폴록사머', registered: '2019-07-23', changed: '2025-12-05' },
      { cas: '68-04-2', name: '구연산나트륨', registered: '2017-04-11', changed: '' },
      { cas: '1310-58-3', name: '수산화칼륨', registered: '2021-09-09', changed: '2025-11-19' },
      { cas: '7664-38-2', name: '인산', registered: '2016-12-12', changed: '' },
      { cas: '8001-79-4', name: '피마자유', registered: '2020-05-28', changed: '2025-10-08' }
    ];

    const casInput = document.getElementById('f-casno');
    wireCasNoInput(casInput);

    function render(rows) {
      const tbody = document.getElementById('result-body');
      const changedCount = rows.filter(r => r.changed).length;
      document.getElementById('result-count').innerHTML = `
        <div class="stat-block"><span class="stat-label">변경</span><span class="stat-value stat-changed">${changedCount}건</span></div>
        <div class="stat-divider"></div>
        <div class="stat-block"><span class="stat-label">전체</span><span class="stat-value">${rows.length}건</span></div>
      `;
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><span class="cas-code">${r.cas}</span></td>
          <td>${r.changed ? '' : '<span class="flag-y flag-original">Y</span>'}</td>
          <td>${r.registered}</td>
          <td>${r.changed ? '<span class="flag-y flag-changed">Y</span>' : ''}</td>
          <td class="${r.changed ? 'changed' : ''}">${r.changed || '-'}</td>
          <td><button class="detail-btn" data-cas="${r.cas}">상세조회</button></td>
        </tr>
      `).join('');
    }

    function applyFilter() {
      const casVal = casInput.value.trim();
      const regFrom = document.getElementById('f-reg-from').value;
      const regTo = document.getElementById('f-reg-to').value;
      const chgFrom = document.getElementById('f-chg-from').value;
      const chgTo = document.getElementById('f-chg-to').value;
      const mode = document.getElementById('f-mode').value;

      let rows = CAS_DATA.slice();

      // 드롭박스 규칙: 전체 = 필터 없음 / 동일 = 변경일자 공란 / 변경 = 변경일자 존재
      if (mode === 'same') rows = rows.filter(r => !r.changed);
      else if (mode === 'changed') rows = rows.filter(r => !!r.changed);

      if (casVal) rows = rows.filter(r => r.cas.includes(casVal));

      // 등록일자 범위(From~To, 한쪽만 입력해도 동작)
      if (regFrom) rows = rows.filter(r => r.registered >= regFrom);
      if (regTo) rows = rows.filter(r => r.registered <= regTo);

      // 변경일자 범위 - 변경이력이 있는 건만 대상으로 비교
      if (chgFrom || chgTo) {
        rows = rows.filter(r => r.changed
          && (!chgFrom || r.changed >= chgFrom)
          && (!chgTo || r.changed <= chgTo));
      }

      // 정렬: 동일 모드(변경일자 없음)만 최신 등록일자가 상단, 그 외(전체/변경)는 최신 변경일자가 상단
      if (mode === 'same') {
        rows.sort((a, b) => (a.registered < b.registered ? 1 : -1));
      } else {
        rows.sort((a, b) => (a.changed < b.changed ? 1 : -1));
      }

      render(rows);
    }

    document.getElementById('btn-search').addEventListener('click', applyFilter);
    casInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyFilter(); });

    document.getElementById('result-body').addEventListener('click', e => {
      const btn = e.target.closest('.detail-btn');
      if (!btn) return;
      alert(`CAS No. ${btn.dataset.cas} 상세조회 페이지는 추후 구축 예정입니다.`);
    });

    applyFilter();
  </script>
</body>
</html>
