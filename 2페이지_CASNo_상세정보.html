</head>
<body>

    <header>

               onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
          <div class="logo-fallback" id="logo-fallback">SP SAMHWA</div>
        </div>
        <div class="page-title">화학물질 변경이력 조회</div>
      </div>
      <div class="header-right">
        <div class="user-badge" id="header-user">
          <div class="user-avatar">
            <img src="user-photo.png" alt="홍길동"
                 onerror="this.replaceWith(document.createTextNode('홍'));">
          </div>
          <div class="user-text">
            <div class="user-team">품질경영팀</div>
            <div class="user-name">홍길동 프로</div>
          </div>
        </div>
        <div class="header-clock" id="header-clock"></div>
      </div>
    </header>

    <div class="app-body">
      <nav class="sidebar">
        <div class="sidebar-label">MENU</div>
        <a href="1페이지_메인대시보드.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 3"/></svg></span>변경이력 조회
        </a>
        <a href="2페이지_CASNo_DB조회.html" class="active">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/></svg></span>CAS No. DB 조회
        </a>
        <div class="submenu">
          <a href="2페이지_CASNo_DB조회.html">CAS No. 변경 이력</a>
          <a href="2페이지_CASNo_상세정보.html" class="active">CAS No. 상세 정보</a>
        </div>
        <a href="3페이지_재료_DB조회.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8l9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></span>재료 DB 조회
        </a>
        <a href="4페이지_제품_DB조회.html">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10 12.5 2.5 3 3l.5 9.5L11 20a2 2 0 0 0 2.8 0L20 13.8a2 2 0 0 0 0-2.8Z"/><circle cx="8.5" cy="7.5" r="1.5"/></svg></span>제품 DB 조회
        </a>
      </nav>

      <main>
        <div class="search-card">
          <div class="search-grid">
            <div class="search-field">
              <label for="f-cas-detail">CAS No. 조회</label>
              <input type="text" id="f-cas-detail" placeholder="예: 64-17-5">
            </div>
            <button class="search-btn" id="btn-search">조회</button>
          </div>
        </div>

        <div id="result-area"></div>
      </main>
    </div>
  </div>

  <script src="common.js?v=20260918f"></script>
  <script>
    // ---------- CAS No. 상세 정보 예시 데이터 ----------
    // 실제 등록 양식(GED02)의 섹션 구성만 보여주는 용도라 공장명/등록번호 등은 전부
    // 일반화된 placeholder 값을 사용함 (회사 고유 데이터 아님)
    const CAS_DETAIL_EXAMPLES = {
      '64-17-5': {
        name: '에탄올',
        registered: '2019-05-10',
        facts: [
          { section: '산업안전보건법', item: '작업환경측정대상 물질', values: ['X'] },
          { section: '산업안전보건법', item: '관리대상 유해물질', values: ['X'] },
          { section: '산업안전보건법', item: '특별관리물질', values: ['X'] },
          { section: '산업안전보건법', item: '노출기준설정물질', values: ['O'] },

          { section: '화학물질관리법', item: '인체급성유해성물질', values: [] },
          { section: '화학물질관리법', item: '인체만성유해성물질', values: ['0.1', '예시고시-0000-000', '2025-01-01', '2028-01-01', '2028-01-01'] },
          { section: '화학물질관리법', item: '제조업 허가', values: ['예시 사업장 A', 'O'] },
          { section: '화학물질관리법', item: '제조업 허가', values: ['예시 사업장 B', 'X'] },
          { section: '화학물질관리법', item: '사용업 허가', values: ['예시 사업장 A', 'O'] },

          { section: '화학물질 등록 및 평가에 관한 법률', item: '화학물질종류', values: ['기존화학물질'] },
          { section: '화학물질 등록 및 평가에 관한 법률', item: '등록번호', values: ['00-000000-0000'] },
          { section: '화학물질 등록 및 평가에 관한 법률', item: '중점관리물질', values: ['X'] },

          { section: '해외 규제', item: 'PFAS', values: ['X'] },
          { section: '해외 규제', item: 'SVHC', values: ['X'] },

          { section: '물질 정보', item: '독성(경구)', values: ['예시 LD50 값', '0'] },
          { section: '물질 정보', item: '수생(어류)', values: ['예시 LC50 값', '0'] },

          { section: '유해 위험성 분류', item: '노동부', values: ['물리적 위험성', '예시 항목', '구분 0'] },
          { section: '유해 위험성 분류', item: '환경부', values: ['건강 유해성', '예시 항목', '구분 0'] }
        ]
      }
    };

    wireComingSoonLinks();

    const casInput = document.getElementById('f-cas-detail');
    wireCasNoInput(casInput);

    function valueCell(value) {
      if (value === undefined || value === '') return '<td>-</td>';
      if (value === 'O') return '<td><span class="flag-y badge-o">O</span></td>';
      if (value === 'X') return '<td><span class="flag-y badge-x">X</span></td>';
      return `<td>${value}</td>`;
    }

    function sectionTableHtml(section, facts) {
      const maxCols = Math.max(1, ...facts.map(f => f.values.length));
      const headCells = Array.from({ length: maxCols }, (_, i) => `<th>${maxCols === 1 ? '값' : '값 ' + (i + 1)}</th>`).join('');
      const rows = facts.map(f => {
        const cells = Array.from({ length: maxCols }, (_, i) => valueCell(f.values[i])).join('');
        return `<tr><td>${f.item}</td>${cells}</tr>`;
      }).join('');
      return `
        <div class="card">
          <div class="card-header"><h3>${section}</h3></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>항목</th>${headCells}</tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderDetail(casNo) {
      const area = document.getElementById('result-area');
      if (!casNo) {
        area.innerHTML = '<div class="coming-soon-banner">조회할 CAS No.를 입력하세요.</div>';
        return;
      }

      const data = CAS_DETAIL_EXAMPLES[casNo];
      if (!data) {
        area.innerHTML = `<div class="coming-soon-banner">CAS NO. ${casNo}에 대한 등록 정보가 없습니다.</div>`;
        return;
      }

      const sections = new Map();
      data.facts.forEach(f => {
        if (!sections.has(f.section)) sections.set(f.section, []);
        sections.get(f.section).push(f);
      });

      const basicInfo = `
        <div class="card">
          <div class="card-header"><h3>기본 정보</h3></div>
          <table>
            <tbody>
              <tr><td style="width:140px;font-weight:700;">CAS NO.</td><td><span class="cas-code">${casNo}</span></td></tr>
              <tr><td style="font-weight:700;">화학물질명</td><td>${data.name || '-'}</td></tr>
              <tr><td style="font-weight:700;">등록일자</td><td>${data.registered}</td></tr>
            </tbody>
          </table>
        </div>
      `;

      const sectionHtml = Array.from(sections.entries()).map(([section, facts]) => sectionTableHtml(section, facts)).join('');

      area.innerHTML = `<div style="display:flex;flex-direction:column;gap:20px;">${basicInfo}${sectionHtml}</div>`;
    }

    document.getElementById('btn-search').addEventListener('click', () => renderDetail(casInput.value.trim()));
    casInput.addEventListener('keydown', e => { if (e.key === 'Enter') renderDetail(casInput.value.trim()); });

    // 2페이지(CAS No. 변경 이력)의 "상세조회" 버튼에서 ?cas=64-17-5 형태로 넘어온 경우 자동 조회
    const initialCas = new URLSearchParams(location.search).get('cas') || '';
    casInput.value = initialCas;
    renderDetail(initialCas);
  </script>
</body>
</html>
