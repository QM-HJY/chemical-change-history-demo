<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화학물질 변경이력 조회</title>
<style>
  @font-face {
    font-family: 'Pretendard Variable';
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url('fonts/PretendardVariable.woff2') format('woff2-variations');
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #f3f5f9;
    font-family: "Pretendard Variable", "Pretendard", "Segoe UI", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #pin-gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pin-box {
    width: 100%;
    max-width: 340px;
    background: #ffffff;
    border: 1px solid #e5e9f0;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 43, 82, 0.12);
    padding: 36px 30px;
    text-align: center;
  }
  .pin-title { font-size: 18px; font-weight: 800; letter-spacing: -0.2px; color: #0f2b52; }
  .pin-sub { margin-top: 8px; font-size: 13px; color: #6b7385; }
  .pin-input {
    margin-top: 24px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    letter-spacing: 8px;
    padding: 12px 0;
    border: 1px solid #e5e9f0;
    border-radius: 10px;
    background: #f3f5f9;
    color: #1a2233;
    font-family: inherit;
  }
  .pin-input:focus { outline: none; border-color: #3b82f6; background: #ffffff; }
  .pin-submit {
    margin-top: 14px;
    width: 100%;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    background: #0f2b52;
    color: #fff;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }
  .pin-submit:hover { background: #16345f; }
  .pin-error {
    margin-top: 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: #dc2626;
  }
  .pin-note {
    margin-top: 20px;
    font-size: 11px;
    color: #98a1b3;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="pin-gate">
    <div class="pin-box">
      <div class="pin-title">화학물질 변경이력 조회</div>
      <div class="pin-sub">접속하려면 PIN 번호를 입력하세요</div>
      <input type="password" id="pin-input" class="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off">
      <button type="button" id="pin-submit" class="pin-submit">확인</button>
      <div id="pin-error" class="pin-error" hidden></div>
      <div class="pin-note">본 PIN 화면은 정적 페이지의 가벼운 접근 차단용이며, 완전한 보안 인증을 대체하지 않습니다.</div>
    </div>
  </div>

  <script>
    // SHA-256("1946") — PIN 원문은 코드에 저장하지 않고 해시로만 비교
    const PIN_HASH = '8ba5ef4e282bf7bc5cf13f731a1b9f525bd3b1f69cbfa24c1c69c303c0ac7019';
    const SESSION_KEY = 'chemChangeHistoryPinVerified';
    const ENTRY_PAGE = '1페이지_메인대시보드.html';

    function goToApp() {
      location.replace(ENTRY_PAGE);
    }

    // 순수 JS SHA-256 구현 (ASCII 입력 전용, public domain 알고리즘)
    // Web Crypto(crypto.subtle)는 HTTPS/localhost가 아닌 일반 사내망 IP(http://)에서는
    // "보안 컨텍스트"가 아니라서 막히기 때문에, 이 PIN 게이트는 브라우저 API 대신
    // 아래 구현으로 직접 해시를 계산해 어떤 환경에서도 동작하게 함
    function sha256Hex(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let i, j;
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;

      let hash = sha256Hex.h = sha256Hex.h || [];
      const k = sha256Hex.k = sha256Hex.k || [];
      let primeCounter = k.length;

      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }

      ascii += '\x80';
      while (ascii.length % 64 - 56) ascii += '\x00';
      for (i = 0; i < ascii.length; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << ((3 - i) % 4) * 8;
      }
      words[words.length] = ((asciiBitLength / maxWord) | 0);
      words[words.length] = (asciiBitLength);

      for (j = 0; j < words.length;) {
        const w = words.slice(j, j += 16);
        const oldHash = hash;
        hash = hash.slice(0, 8);

        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = hash[0], e = hash[4];
          const temp1 = hash[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & hash[5]) ^ ((~e) & hash[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
              w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
            ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }

        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }

      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += ((b < 16) ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    if (localStorage.getItem(SESSION_KEY) === 'true') {
      goToApp();
    } else {
      const input = document.getElementById('pin-input');
      const submitBtn = document.getElementById('pin-submit');
      const errorEl = document.getElementById('pin-error');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }

      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 10);
        errorEl.hidden = true;
      });

      function verify() {
        if (input.value.length === 0) {
          showError('PIN 번호를 입력하세요.');
          return;
        }
        const hash = sha256Hex(input.value);
        if (hash === PIN_HASH) {
          localStorage.setItem(SESSION_KEY, 'true');
          goToApp();
        } else {
          showError('PIN 번호가 올바르지 않습니다.');
          input.value = '';
          input.focus();
        }
      }

      submitBtn.addEventListener('click', verify);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') verify();
      });
      input.focus();
    }
  </script>
</body>
</html>
